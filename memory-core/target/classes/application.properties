server.port=8080
spring.application.name=memory

license.enabled=true
license.development.mode=false
license.bypass.enabled=false

spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl

#logging.level.daosupport=INFO
logging.level.daosupport=DEBUG

# HikariCP 连接池配置
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=BusinessDataSourcePool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.read-only=false
logging.level.com.zaxxer.hikari=INFO


