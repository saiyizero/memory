server.port=9090
spring.application.name=memory-service
spring.sql.init.mode=never

spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl

logging.level.daosupport=DEBUG

# 元数据库：仅使用 mmapi schema
memory.datasource.driver-class-name=org.postgresql.Driver
memory.datasource.url=jdbc:postgresql://10.1.146.70:5433/m5sit?currentSchema=mmapi
memory.datasource.username=memory
memory.datasource.password=memory@123
memory.datasource.schema=mmapi

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=MemoryServicePool
logging.level.com.zaxxer.hikari=INFO
