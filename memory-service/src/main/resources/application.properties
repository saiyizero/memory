server.port=8080
spring.application.name=memory-service
spring.sql.init.mode=never

spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.suffix=.ftl

logging.level.daosupport=DEBUG

# 元数据库：沿用原客户端 local_setting(status=Y) 的连接
memory.datasource.driver-class-name=org.sqlite.JDBC
memory.datasource.url=jdbc:sqlite:/Users/haoyulin/foxi_tmp/database/memory_embedded.db
memory.datasource.username=
memory.datasource.password=

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=MemoryServicePool
logging.level.com.zaxxer.hikari=INFO
